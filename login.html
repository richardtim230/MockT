<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - D-RICH TUTORIAL COLLEGE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-800 antialiased relative overflow-x-hidden">

  <!-- Ambient Decorative Background Elements -->
  <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
    <div class="w-72 h-72 sm:w-96 sm:h-96 bg-blue-100/60 rounded-full blur-3xl absolute -top-20 -left-20"></div>
    <div class="w-64 h-64 sm:w-80 sm:h-80 bg-indigo-100/50 rounded-full blur-3xl absolute -bottom-20 -right-20"></div>
  </div>

  <!-- Main Login Card Container -->
  <main class="relative z-10 w-full max-w-md my-auto">
    <div class="bg-white/90 backdrop-blur-md border border-slate-200/80 rounded-2xl shadow-xl overflow-hidden transition-all">
      
      <!-- Card Header Banner -->
      <div class="bg-blue-900 text-white px-6 py-6 text-center relative">
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">D-RICH TUTORIAL COLLEGE</h1>
        <p class="text-blue-200 text-xs sm:text-sm mt-1 font-medium">Student Portal Sign In</p>
      </div>

      <div class="p-6 sm:p-8">
        
        <!-- Welcome Heading -->
        <div class="mb-6 text-center">
          <h2 class="text-xl font-bold text-slate-800 tracking-tight">Welcome back!</h2>
          <p class="text-xs text-slate-500 mt-1">Please enter your credentials to access your account.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" autocomplete="off" class="space-y-4" novalidate>
          
          <!-- Email / Phone Input -->
          <div>
            <label for="userKey" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Email or Phone Number</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </span>
              <input
                type="text"
                id="userKey"
                name="userKey"
                required
                class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400 text-slate-800"
                placeholder="e.g., student@email.com or 08012345678"
                autocomplete="username"
              >
            </div>
            <span class="text-xs text-red-500 mt-1 block hidden" id="error-userKey">Please enter your email or phone number.</span>
          </div>

          <!-- Password Input -->
          <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Password</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                required
                class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400 text-slate-800"
                placeholder="••••••••"
                autocomplete="current-password"
              >
              <button 
                type="button" 
                tabindex="-1"
                id="togglePassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition"
                aria-label="Toggle password visibility"
              >
                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </button>
            </div>
            <span class="text-xs text-red-500 mt-1 block hidden" id="error-password">Please enter your password.</span>
          </div>

          <!-- Registration Link -->
          <div class="flex items-center justify-end text-xs pt-1">
            <a href="registration.html" class="text-blue-700 hover:text-blue-900 font-semibold underline transition">
              Don't have an account? Register
            </a>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button 
              type="submit"
              class="w-full py-2.5 px-4 rounded-lg bg-blue-900 hover:bg-blue-800 text-white font-semibold shadow-md text-sm transition flex items-center justify-center gap-2"
            >
              <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
              </svg>
              Sign In
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <!-- Modal Feedback & Destination Portal Switcher -->
  <div id="modal-feedback" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center transform transition-all border border-slate-100">
      <div id="modal-spinner" class="mb-4 spinner mx-auto"></div>
      <div id="modal-message" class="text-sm font-medium text-slate-700 leading-relaxed"></div>
      
      <!-- Close Button for Errors -->
      <button 
        type="button" 
        id="modal-close" 
        class="mt-5 w-full bg-blue-900 hover:bg-blue-800 text-white text-xs font-semibold py-2.5 rounded-lg transition hidden"
      >
        Close
      </button>

      <!-- Destination choices on Successful Authentication -->
      <div id="modal-choice-section" class="hidden mt-5 space-y-3">
        <button 
          type="button" 
          id="go-dashboard" 
          class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition text-xs flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7m-9 2v8a2 2 0 002 2h4a2 2 0 002-2v-8m-6 0l2 2"/>
          </svg>
          Student Dashboard
        </button>
        
        <button 
          type="button" 
          id="go-cbt" 
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition text-xs flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          CBT Examination Portal
        </button>
      </div>
    </div>
  </div>

  <script>
  const API_URL = "https://examguide.onrender.com/api/student/login";

  // Password visibility toggle
  document.getElementById('togglePassword').addEventListener('click', function() {
    const pass = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    if (pass.type === 'password') {
      pass.type = 'text';
      eye.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-5 0-9-4.5-9-7a9.013 9.013 0 013.075-5.775M15 12a3 3 0 01-6 0 3 3 0 016 0zm6 0a9 9 0 11-18 0 9 9 0 0118 0z"/>`;
    } else {
      pass.type = 'password';
      eye.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 0a9 9 0 11-18 0 9 9 0 0118 0z"/>`;
    }
  });

  // Modal feedback controller
  function showModal(msg, loading = true, showChoices = false) {
    document.getElementById('modal-message').innerHTML = msg;
    document.getElementById('modal-feedback').classList.remove('hidden');
    document.getElementById('modal-spinner').style.display = loading ? 'block' : 'none';
    document.getElementById('modal-close').style.display = loading || showChoices ? 'none' : 'block';
    document.getElementById('modal-choice-section').classList.toggle('hidden', !showChoices);
  }

  function hideModal() {
    document.getElementById('modal-feedback').classList.add('hidden');
  }

  document.getElementById('modal-close').onclick = hideModal;

  document.getElementById('go-dashboard').onclick = function() {
    hideModal();
    window.location.href = "dashboard.html";
  };

  document.getElementById('go-cbt').onclick = function() {
    hideModal();
    window.location.href = "access.html";
  };

  // Form submit handler
  document.getElementById('loginForm').onsubmit = async function(e) {
    e.preventDefault();
    let valid = true;

    const userKeyInput = document.getElementById('userKey');
    const passInput = document.getElementById('password');
    const userKey = userKeyInput.value.trim();
    const pass = passInput.value.trim();
    
    const errUser = document.getElementById('error-userKey');
    const errPass = document.getElementById('error-password');

    if (!userKey) {
      errUser.classList.remove('hidden'); 
      valid = false;
    } else { 
      errUser.classList.add('hidden'); 
    }

    if (!pass) {
      errPass.classList.remove('hidden'); 
      valid = false;
    } else { 
      errPass.classList.add('hidden'); 
    }

    if (!valid) return;

    showModal('Authenticating, please wait...', true);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ emailOrPhone: userKey, password: pass })
      });

      let result = {};
      try { result = await res.json(); } catch(e) {}

      if (res.ok && result.user && result.token) {
        // Save tokens and role
        localStorage.setItem("jwt_token", result.token);
        localStorage.setItem("student_jwt_token", result.token);
        localStorage.setItem("user_role", result.user.role);

        // Prompt user for destination on success
        showModal(
          `<span class="text-emerald-600 font-semibold block text-base">✔️ Login Successful!</span>
           <span class="text-xs text-slate-500 mt-1 block">Where would you like to proceed?</span>`,
          false,
          true
        );
      } else {
        showModal(
          result.message
            ? `<span class="text-red-600 font-semibold">❌ ${result.message}</span>`
            : "<span class='text-red-600 font-semibold'>❌ Invalid login credentials. Please try again.</span>", 
          false
        );
      }
    } catch (e) {
      showModal("<span class='text-red-600 font-semibold'>❌ Network error. Please check your connection and try again.</span>", false);
    }
  };
  </script>
</body>
</html>
