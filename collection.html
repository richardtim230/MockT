<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insect Collection Data Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .output-tag {
      font-family: 'Times New Roman', Times, serif !important;
      font-size: 12pt !important;
      line-height: 1.3;
    }

    .order-tag {
      font-family: 'Times New Roman', Times, serif !important;
      font-size: 14pt !important;
      line-height: 1.4;
    }

    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      .page-break {
        page-break-before: always;
        break-before: page;
      }
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <div class="no-print max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    
    <header class="bg-white rounded-2xl p-6 shadow-sm mb-6 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-bug text-emerald-600"></i> Insect Collection Entry
        </h1>
        <p class="text-sm text-slate-500 mt-1">Input specimen details and generate A4 printable labels (Data & Orders).</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="print-btn" onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-print"></i> Print A4 Pages
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <div class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
          <h2 class="font-bold text-slate-800 text-lg">Specimen Entry</h2>
          <span id="counter-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">0 / 30 Recorded</span>
        </div>

        <form id="insect-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Common Name</label>
            <input type="text" id="commonName" required placeholder="e.g. Dung Beetle" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Scientific Name</label>
            <input type="text" id="scientificName" required placeholder="e.g. Scarabaeus sacer" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Order</label>
            <input type="text" id="order" required placeholder="e.g. Coleoptera" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date of Collection</label>
            <input type="date" id="date" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Location</label>
            <input type="text" id="location" required placeholder="e.g. OAU Campus, Ile-Ife" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Collected By</label>
            <input type="text" id="collector" required placeholder="e.g. Timothy R.O." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>

          <button type="submit" id="add-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> Add Specimen Data
          </button>
        </form>
      </div>

      <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
            <h2 class="font-bold text-slate-800 text-lg">Recorded Specimens</h2>
            <button onclick="clearAllData()" class="text-xs font-semibold text-rose-600 hover:text-rose-700">Clear All</button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-500 font-semibold uppercase border-b border-slate-200">
                <tr>
                  <th class="p-2.5">#</th>
                  <th class="p-2.5">Common Name</th>
                  <th class="p-2.5">Scientific Name</th>
                  <th class="p-2.5">Order</th>
                  <th class="p-2.5">Date</th>
                  <th class="p-2.5">Location</th>
                  <th class="p-2.5">Collected By</th>
                  <th class="p-2.5 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="table-body" class="divide-y divide-slate-100 text-slate-700">
              </tbody>
            </table>
          </div>
        </div>

        <div class="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-500 flex justify-between items-center">
          <span>Target A4 sheet capacity: 30 boxed records per page.</span>
        </div>
      </div>

    </div>
  </div>

  <div class="hidden print-only bg-white">
    <!-- PAGE 1: SPECIMEN DATA LABELS -->
    <div id="print-grid" class="grid grid-cols-2 gap-2">
    </div>

    <!-- PAGE 2: ORDERS LIST PAGE -->
    <div class="page-break pt-4">
      <div id="orders-grid" class="grid grid-cols-2 gap-2">
      </div>
    </div>
  </div>

  <script>
    let insectRecords = [];
    const maxCapacity = 30;

    const insectForm = document.getElementById('insect-form');
    const tableBody = document.getElementById('table-body');
    const counterBadge = document.getElementById('counter-badge');
    const printGrid = document.getElementById('print-grid');
    const ordersGrid = document.getElementById('orders-grid');
    const addBtn = document.getElementById('add-btn');

    insectForm.addEventListener('submit', (e) => {
      e.preventDefault();

      if (insectRecords.length >= maxCapacity) {
        alert('Maximum capacity of 30 insect records reached for an A4 sheet page!');
        return;
      }

      const newRecord = {
        id: Date.now(),
        commonName: document.getElementById('commonName').value.trim(),
        scientificName: document.getElementById('scientificName').value.trim(),
        order: document.getElementById('order').value.trim(),
        date: document.getElementById('date').value,
        location: document.getElementById('location').value.trim(),
        collector: document.getElementById('collector').value.trim(),
      };

      insectRecords.push(newRecord);
      insectForm.reset();
      renderUI();
    });

    function deleteRecord(id) {
      insectRecords = insectRecords.filter(item => item.id !== id);
      renderUI();
    }

    function clearAllData() {
      if (confirm('Are you sure you want to clear all insect entries?')) {
        insectRecords = [];
        renderUI();
      }
    }

    function renderUI() {
      counterBadge.textContent = `${insectRecords.length} / ${maxCapacity} Recorded`;
      if (insectRecords.length >= maxCapacity) {
        counterBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700";
        addBtn.disabled = true;
        addBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        counterBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600";
        addBtn.disabled = false;
        addBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }

      tableBody.innerHTML = '';
      if (insectRecords.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">No insect records added yet. Fill out the form to add entries.</td></tr>`;
      } else {
        insectRecords.forEach((item, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="p-2.5 font-bold text-slate-400">${index + 1}</td>
            <td class="p-2.5 font-bold text-slate-800">${item.commonName}</td>
            <td class="p-2.5 italic">${item.scientificName}</td>
            <td class="p-2.5">${item.order}</td>
            <td class="p-2.5">${item.date}</td>
            <td class="p-2.5">${item.location}</td>
            <td class="p-2.5">${item.collector}</td>
            <td class="p-2.5 text-right">
              <button onclick="deleteRecord(${item.id})" class="text-rose-500 hover:text-rose-700 p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }

      // PAGE 1: DATA LABELS
      printGrid.innerHTML = '';
      insectRecords.forEach((item) => {
        const box = document.createElement('div');
        box.className = "border border-black p-2 output-tag box-border";
        box.innerHTML = `
          <div><strong>Common Name:</strong> ${item.commonName}</div>
          <div><strong>Scientific Name:</strong> <em>${item.scientificName}</em></div>
          <div><strong>Date of Collection:</strong> ${item.date}</div>
          <div><strong>Location:</strong> ${item.location}</div>
          <div><strong>Collected By:</strong> ${item.collector}</div>
        `;
        printGrid.appendChild(box);
      });

      const emptySlots = maxCapacity - insectRecords.length;
      for (let i = 0; i < emptySlots; i++) {
        const emptyBox = document.createElement('div');
        emptyBox.className = "border border-black p-2 output-tag box-border";
        emptyBox.innerHTML = `
          <div><strong>Common Name:</strong> </div>
          <div><strong>Scientific Name:</strong> </div>
          <div><strong>Date of Collection:</strong> </div>
          <div><strong>Location:</strong> </div>
          <div><strong>Collected By:</strong> </div>
        `;
        printGrid.appendChild(emptyBox);
      }

      // PAGE 2: ORDERS PAGE (14pt Times New Roman)
      ordersGrid.innerHTML = '';
      insectRecords.forEach((item) => {
        const orderBox = document.createElement('div');
        orderBox.className = "border border-black p-2.5 order-tag box-border";
        orderBox.innerHTML = `<div><strong>Order:</strong> ${item.order}</div>`;
        ordersGrid.appendChild(orderBox);
      });

      for (let i = 0; i < emptySlots; i++) {
        const emptyOrderBox = document.createElement('div');
        emptyOrderBox.className = "border border-black p-2.5 order-tag box-border";
        emptyOrderBox.innerHTML = `<div><strong>Order:</strong> </div>`;
        ordersGrid.appendChild(emptyOrderBox);
      }
    }

    renderUI();
  </script>
</body>
</html>
